plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

java {
	// gradle 6.7 이상부터 지원
	// sourceCompatibility, targetCompatibility 대체
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

allprojects {
	group = 'resume'
	version = '0.0.1'

    repositories {
        mavenCentral()
    }
}

subprojects {
	apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    
    dependencies {
		//spring
		implementation 'org.springframework.boot:spring-boot-starter'
		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		//lombok
		implementation 'org.projectlombok:lombok:1.18.32'
	    annotationProcessor 'org.projectlombok:lombok:1.18.32'
	    //swagger
	    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
		// postgresql
		implementation 'org.postgresql:postgresql'
		// JDBC + HikariCP
		implementation 'org.springframework.boot:spring-boot-starter-jdbc'
		//mybatis
		implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
		//외부 jar 추가
		implementation fileTree(dir: 'libs', include: ['*.jar'])
        // playwright
        implementation 'com.microsoft.playwright:playwright:1.49.0'
        // 이력서 파일 가져오기
        implementation 'org.apache.pdfbox:pdfbox:3.0.3'      // PDF
        implementation 'org.apache.poi:poi-ooxml:5.3.0'      // Word(.docx)
        // R2
        implementation platform('software.amazon.awssdk:bom:2.31.0')
        implementation 'software.amazon.awssdk:s3'
	}
}

// Playwright 브라우저(Chromium) 설치
// resume-web 의 application.properties 에 있는 playwright.browsers-path 경로에 설치
tasks.register('installPlaywright', JavaExec) {
    group = 'playwright'
    description = 'resume-web 의 application.properties 경로에 Chromium 설치'

    def web = project(':resume-web')
    def appProps = new Properties()
    web.file('src/main/resources/application.properties').withInputStream { appProps.load(it) }
    def browsersPath = project.findProperty('browsersPath')
            ?: appProps.getProperty('playwright.browsers-path')

    classpath = web.sourceSets.main.runtimeClasspath   // 루트에는 playwright 의존성이 없어서 web 모듈 것을 사용
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
    environment 'PLAYWRIGHT_BROWSERS_PATH', browsersPath
}

tasks.named('test') {
    useJUnitPlatform()
}