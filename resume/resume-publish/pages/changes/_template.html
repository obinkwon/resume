<!doctype html>
<html lang="ko">
<head>
    <title>변경 제목 - 퍼블리싱</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../css/common.css" rel="stylesheet">
    <!-- 바뀐 CSS 를 여기에 추가 -->
    <link href="../../publish/publish.css" rel="stylesheet">
</head>
<!-- CSS 변경 산출물 양식 : yyyyMMdd-이름.html 로 복사해서 채우고 publish/catalog.js 에 등록 (이 파일은 등록하지 않음) -->
<body>
    <main class="pub-page">
        <h1 class="pub-page-title">변경 제목</h1>

        <section class="pub-section">
            <h2 class="pub-section-title">변경 내용</h2>
            <div class="pub-demo">
                <table class="pub-table">
                    <thead>
                        <tr><th>파일</th><th>구분</th><th>내용</th><th>반영 상태</th></tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><code>css/파일.css</code></td>
                            <td>수정</td>
                            <td>무엇을 왜 바꿨는지 적습니다.</td>
                            <td><span class="badge gray">resume-web 미반영</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="pub-section">
            <h2 class="pub-section-title">미리보기</h2>
            <p class="pub-note">바뀐 부분이 보이는 마크업을 더미 데이터로 넣습니다.</p>
            <div class="pub-demo">
                <!-- 여기에 마크업 -->
            </div>
        </section>
    </main>
    <div data-partial="publishBar"></div>
    <script src="../../publish/partials.js"></script>
    <script src="../../publish/publish.js"></script>
</body>
</html>
