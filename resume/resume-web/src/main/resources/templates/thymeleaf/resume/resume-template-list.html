<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Spring Security 사용 시 CSRF 토큰 (없으면 자동으로 생략됨) -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <title>내 템플릿</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/resume-template-list.css}">
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/resume-template-list.js}" defer></script>
</head>
<!--/* 템플릿 목록은 화면이 열린 뒤 JS 가 /api/template/list 로 불러와서 그림 */-->
<body th:with="hasResume=${resumeId != null}"
      th:attr="data-resume-id=${resumeId},
               data-list-url=@{/api/template/list},
               data-delete-url=@{/api/template/},
               data-edit-url=@{/web/template/edit/},
               data-new-url=@{/web/template/regist}">

    <div class="container">
        <div class="page-header">
            <div class="page-header__left">
                <a class="btn secondary sm" th:href="@{/web/resume/list}">
                    <i class="icon icon-arrow-left sm"></i>
                    <span>목록</span>
                </a>
                <h1>내 템플릿</h1>
            </div>
            <div class="btn-group">
                <a class="btn primary" th:href="@{/web/template/regist}">
                    <i class="icon icon-plus"></i> 새 템플릿
                </a>
            </div>
        </div>

        <!-- ===== 내가 만든 템플릿 ===== -->
        <div class="section">
            <h2 class="tl-title">
                내가 만든 템플릿
                <span class="badge gray d-none" id="myCount">0</span>
            </h2>

            <!-- 불러오는 중 -->
            <div class="empty-state" id="listLoading" role="status" aria-live="polite">
                <p>템플릿을 불러오는 중…</p>
            </div>

            <!-- 불러오기 실패 -->
            <div class="empty-state d-none" id="listError" role="alert">
                <p>템플릿 목록을 불러오지 못했어요.</p>
                <button type="button" class="btn secondary" id="btnRetry">다시 시도</button>
            </div>

            <div class="tl-grid d-none" id="myTemplateGrid"></div>

            <div class="empty-state d-none" id="myEmpty">
                <p>아직 만든 템플릿이 없어요. 빈 템플릿에서 시작하거나 아래 기본 템플릿을 복사해 보세요.</p>
                <a class="btn outline" th:href="@{/web/template/regist}">
                    <i class="icon icon-plus"></i> 빈 템플릿에서 시작
                </a>
            </div>
        </div>

        <!-- ===== 기본 템플릿 (있을 때만 보임) ===== -->
        <div class="section d-none" id="publicSection">
            <h2 class="tl-title">
                기본 템플릿에서 시작
                <span class="text-sm text-faint fw-normal">복사해서 만들면 원본은 그대로 남아요</span>
            </h2>
            <div class="tl-grid" id="publicTemplateGrid"></div>
        </div>
    </div>

    <!-- 삭제 결과 -->
    <div class="toast d-none" id="listToast" role="status" aria-live="polite"></div>

</body>
</html>
