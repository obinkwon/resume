<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>이력서 작성</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/resume-form.css}">
    <script th:src="@{/js/resume-form.js}"></script>
</head>
<body>
    <div class="container">
        <h1>이력서 작성</h1>
        <form method="post" id="resumeForm">
            <div class="section">
                <h2>기본 정보</h2>
                <input type="text" name="title" placeholder="이력서 제목">
                <input type="text" name="name" placeholder="이름">
                <input type="email" name="email" placeholder="이메일">
                <input type="text" name="phone" placeholder="전화번호">
            </div>
            <div class="section">
                <h2>자기소개</h2>
                <textarea name="summary" rows="6"></textarea>
            </div>
            <div class="section">
                <h2>경력</h2>
                <div id="experienceList">
                    <div class="item">
                        <input type="text" name="company" placeholder="회사명">
                        <input type="text" name="position" placeholder="직무">
                        <input type="date" name="startDate">
                        <input type="date" name="endDate">
                        <textarea name="description" placeholder="업무 내용"></textarea>
                    </div>
                </div>
                <button type="button" id="addExperience">+ 경력 추가</button>
            </div>
            <div class="section">
                <h2>학력</h2>
                <div id="educationList">
                    <div class="item">
                        <input type="text" name="school" placeholder="학교">
                        <input type="text" name="major" placeholder="전공">
                        <input type="date" name="eduStart">
                        <input type="date" name="eduEnd">
                    </div>
                </div>
                <button type="button" id="addEducation">+ 학력 추가</button>
            </div>
            <div class="section">
                <h2>프로젝트</h2>
                <div id="projectList">
                    <div class="item">
                        <input type="text" name="projectName" placeholder="프로젝트명">
                        <textarea name="projectDescription" placeholder="설명"></textarea>
                        <input type="text" name="techStack" placeholder="Java, Spring Boot, MyBatis">
                    </div>
                </div>
                <button type="button" id="addProject">+ 프로젝트 추가</button>
            </div>
            <div class="section">
                <h2>기술 스택</h2>
                <div id="skillList">
                    <input type="text" name="skill" placeholder="기술 입력">
                </div>
                <button type="button" id="addSkill">+ 기술 추가</button>
            </div>
            <button type="submit" class="btn primary">저장</button>
        </form>
    </div>
</body>
</html>
