<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resume Manager</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/resume-list.css}">
</head>
<body>
    <div class="container">
        <div class="section">
            <div class="page-header">
                <h1>Resume Template Engine</h1>
                <div class="btn-group">
                    <a class="btn primary" th:href="@{/web/resume/regist}">
                        <i class="icon icon-plus"></i> 새 이력서 작성
                    </a>
                </div>
            </div>

            <div class="resume-list" th:unless="${#lists.isEmpty(resumeList)}">
                <div class="resume-card" th:each="resume : ${resumeList}">
                    <span class="badge">이력서</span>
                    <h3 class="ellipsis" th:text="${resume.title}"></h3>
                    <p th:text="${resume.title}"></p>

                    <div class="actions">
                        <a th:href="@{/web/resume/modify/{id}(id=${resume.resumeId})}">
                            <i class="icon icon-edit sm"></i> 수정
                        </a>
                        <a class="template" th:href="@{/web/resume/template/{id}(id=${resume.resumeId})}">
                            <i class="icon icon-copy sm"></i> 템플릿
                        </a>
                        <!-- 템플릿이 있으면 미리보기 링크 -->
                        <a th:if="${resume.templateId != null}" th:href="@{/web/resume/preview/{id}(id=${resume.resumeId})}">
                            <i class="icon icon-eye sm"></i> 미리보기
                        </a>
                        <!-- 템플릿이 없으면 비활성 -->
                        <span th:unless="${resume.templateId != null}" class="is-disabled" aria-disabled="true" title="템플릿을 먼저 선택해 주세요">
                            <i class="icon icon-eye sm"></i> 미리보기
                        </span>
                    </div>
                </div>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(resumeList)}">
                <p>아직 작성된 이력서가 없어요. 새 이력서를 만들어보세요!</p>
                <a class="btn outline" th:href="@{/web/resume/regist}">
                    <i class="icon icon-plus"></i> 첫 이력서 작성하기
                </a>
            </div>
        </div>
    </div>
</body>
</html>
