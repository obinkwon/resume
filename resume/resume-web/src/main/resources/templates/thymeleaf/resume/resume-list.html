<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Spring Security 사용 시 CSRF 토큰 (삭제 요청에 사용, 없으면 자동으로 생략됨) -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <title>이력서 템플릿 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/resume-list.css}">
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/resume-list.js}" defer></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>이력서 템플릿 목록</h1>
            <div class="btn-group">
                <a class="btn primary" th:href="@{/web/resume/regist}">
                    <i class="icon icon-plus"></i> 새 이력서 작성
                </a>
            </div>
        </div>

        <div class="section">
            <div class="resume-list" id="resumeList" th:classappend="${#lists.isEmpty(resumeList)} ? 'd-none'">
                <div class="resume-card" th:each="resume : ${resumeList}"
                     th:attr="data-id=${resume.resumeId},data-title=${resume.title}">
                    <div class="resume-card__head">
                        <h3 class="ellipsis" th:text="${resume.title}" th:title="${resume.title}">이력서 제목</h3>
                        <button type="button" class="btn icon sm danger-ghost resume-card__delete"
                                title="삭제" th:attr="aria-label=${resume.title} + ' 삭제'">
                            <i class="icon icon-trash sm"></i>
                        </button>
                    </div>
                    <!-- 간단 소개 (없으면 안내 문구) -->
                    <p class="resume-card__intro" th:if="${!#strings.isEmpty(resume.introduction)}" th:text="${resume.introduction}">간단 소개</p>
                    <p class="resume-card__intro is-empty" th:if="${#strings.isEmpty(resume.introduction)}">간단 소개가 아직 없어요</p>
                    <div class="resume-card__meta">
                        <span class="badge source-badge" th:with="src=${resume.sourceType != null ? resume.sourceType : T(resume.core.enums.ResumeSource).DIRECT}"
                            th:classappend="'source-badge--' + ${src.cssKey}" th:title="${src.imported and resume.sourceFileName != null} ? '원본 파일: ' + ${resume.sourceFileName} : null">
                            <i th:if="${src.imported}" class="icon icon-upload sm" aria-hidden="true"></i>
                            <span th:text="${src.label}">직접 작성</span>
                        </span>
                        <time class="resume-card__date" th:if="${resume.updatedAt != null}"
                              th:attr="datetime=${resume.updatedAtIso}"
                              th:title="'마지막 수정 ' + ${resume.updatedAtFull}"
                              th:text="${resume.updatedAtText} + ' 수정'">3일 전 수정</time>
                    </div>

                    <div class="actions">
                        <a th:href="@{/web/resume/modify/{id}(id=${resume.resumeId})}">
                            <i class="icon icon-edit sm"></i> 수정
                        </a>
                        <a class="template" th:href="@{/web/resume/template/{id}(id=${resume.resumeId})}">
                            <i class="icon icon-copy sm"></i> 템플릿
                        </a>
                        <!-- 템플릿이 있으면 미리보기 링크 -->
                        <a th:if="${resume.templateId != null}" th:href="@{/web/resume/preview/{id}(id=${resume.resumeId})}">
                            <i class="icon icon-eye sm"></i> 미리보기
                        </a>
                        <!-- 템플릿이 없으면 비활성 -->
                        <span th:unless="${resume.templateId != null}" class="is-disabled" aria-disabled="true" title="템플릿을 먼저 선택해 주세요">
                                <i class="icon icon-eye sm"></i> 미리보기
                            </span>
                    </div>
                </div>
            </div>

            <div class="empty-state" id="resumeEmpty" th:classappend="${!#lists.isEmpty(resumeList)} ? 'd-none'">
                <p>아직 작성된 이력서가 없어요. 새 이력서를 만들어보세요!</p>
                <a class="btn outline" th:href="@{/web/resume/regist}">
                    <i class="icon icon-plus"></i> 첫 이력서 작성하기
                </a>
            </div>
        </div>
    </div>
    <!-- 삭제 결과 (화면 낭독기용 · 실패 안내) -->
    <div class="toast d-none" id="listToast" role="status" aria-live="polite"></div>
</body>
</html>
