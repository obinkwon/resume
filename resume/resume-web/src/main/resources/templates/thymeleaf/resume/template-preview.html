<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>템플릿 미리보기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/template-preview.css}">
    <script th:inline="javascript">
        window.TEMPLATE_SETTING = /*[[${setting}]]*/ null;
    </script>
    <script th:src="@{/js/template-preview.js}"></script>
</head>
<!--
    data-* / style 은 저장된 설정으로 서버에서 먼저 그려 두고,
    빌더 화면에서는 resume-preview.js 가 postMessage 로 실시간 덮어씀
-->
<body th:attr="data-template=${setting.templateCode},data-layout=${setting.layoutType}"
      th:style="|--primary:${setting.primaryColor};--font:'${setting.fontFamily}';--scale:${setting.fontScale / 100.0}|">
    <div class="resume">
        <!-- ===== 인적사항 ===== -->
        <header class="r-header">
            <div class="r-header__main">
                <h1 class="r-name" th:text="${resume.name}">홍길동</h1>
                <p class="r-role" th:if="${resume.title}" th:text="${resume.title}">백엔드 개발자</p>
            </div>
            <ul class="r-contact">
                <li th:if="${resume.email}" th:text="${resume.email}">mail@example.com</li>
                <li th:if="${resume.phone}" th:text="${resume.phone}">010-0000-0000</li>
                <li th:if="${resume.address}" th:text="${resume.address}">서울</li>
                <li th:if="${resume.link}" th:text="${resume.link}">github.com/...</li>
            </ul>
        </header>

        <div class="r-body">
            <main class="r-main" data-zone="main"></main>
            <aside class="r-aside" data-zone="aside"></aside>
        </div>

        <!-- ===== 섹션 원본 (JS가 설정 순서·레이아웃대로 위 zone 으로 옮김) ===== -->
        <div class="r-pool" id="sectionPool">

            <section class="r-section" data-section="intro" th:if="${resume.introduction}">
                <h2 class="r-section__title">자기소개</h2>
                <p class="r-text" th:text="${resume.introduction}">자기소개 내용</p>
            </section>

            <section class="r-section" data-section="career" th:unless="${#lists.isEmpty(careers)}">
                <h2 class="r-section__title">경력</h2>
                <article class="r-item" th:each="c : ${careers}">
                    <div class="r-item__head">
                        <div>
                            <h3 class="r-item__title" th:text="${c.companyName}">회사명</h3>
                            <p class="r-item__sub" th:text="${c.position}">직책</p>
                        </div>
                        <span class="r-period">
                            <span th:text="${#temporals.format(c.startDate, 'yyyy.MM')}">2022.01</span>
                            ~
                            <span th:text="${c.isCurrent} ? '재직 중' : ${#temporals.format(c.endDate, 'yyyy.MM')}">2024.03</span>
                        </span>
                    </div>
                    <p class="r-text" th:if="${c.description}" th:text="${c.description}">업무 내용</p>
                </article>
            </section>

            <section class="r-section" data-section="project" th:unless="${#lists.isEmpty(projects)}">
                <h2 class="r-section__title">프로젝트</h2>
                <article class="r-item" th:each="p : ${projects}">
                    <div class="r-item__head">
                        <div>
                            <h3 class="r-item__title" th:text="${p.projectName}">프로젝트명</h3>
                            <p class="r-item__sub" th:if="${p.role}" th:text="${p.role}">역할</p>
                        </div>
                        <span class="r-period"
                              th:text="${#temporals.format(p.startDate, 'yyyy.MM')} + ' ~ ' + (${p.endDate} != null ? ${#temporals.format(p.endDate, 'yyyy.MM')} : '진행 중')">2023.01 ~ 2023.06</span>
                    </div>
                    <p class="r-text" th:if="${p.description}" th:text="${p.description}">설명</p>
                    <ul class="r-tags" th:if="${p.techStack}">
                        <li th:each="t : ${#strings.arraySplit(p.techStack, ',')}" th:text="${#strings.trim(t)}">Spring</li>
                    </ul>
                </article>
            </section>

            <section class="r-section" data-section="education" th:unless="${#lists.isEmpty(educations)}">
                <h2 class="r-section__title">학력</h2>
                <article class="r-item" th:each="ed : ${educations}">
                    <div class="r-item__head">
                        <div>
                            <h3 class="r-item__title" th:text="${ed.schoolName}">학교명</h3>
                            <p class="r-item__sub" th:text="${ed.major}">전공</p>
                        </div>
                        <span class="r-period"
                              th:text="${#temporals.format(ed.startDate, 'yyyy.MM')} + ' ~ ' + (${ed.endDate} != null ? ${#temporals.format(ed.endDate, 'yyyy.MM')} : '재학 중')">2016.03 ~ 2020.02</span>
                    </div>
                </article>
            </section>

            <section class="r-section" data-section="skill" th:unless="${#lists.isEmpty(skills)}">
                <h2 class="r-section__title">기술스택</h2>
                <ul class="r-tags">
                    <li th:each="s : ${skills}" th:text="${s.skillName}">Java</li>
                </ul>
            </section>
        </div>
    </div>
</body>
</html>
