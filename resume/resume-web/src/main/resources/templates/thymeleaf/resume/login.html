<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-card__head">
            <h1>이력서 작성</h1>
            <p class="text-muted text-md">사용자 ID를 입력하고 이력서 작성을 시작해보세요.</p>
        </div>

        <div class="login-error" th:if="${param.error}" role="alert">
            로그인에 실패했습니다. 사용자 ID를 확인해 주세요.
        </div>

        <form method="post" th:action="@{/web/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label for="userKey">사용자 ID</label>
                <input type="text" id="userKey" name="userKey" placeholder="사용자 ID를 입력하세요"
                       maxlength="100" required autofocus autocomplete="username">
            </div>
            <button type="submit" class="btn primary block">
                시작하기 <i class="icon icon-arrow-right sm"></i>
            </button>
        </form>

        <p class="login-card__foot">처음이라면 원하는 ID로 바로 시작할 수 있어요.</p>
    </div>
</body>
</html>
