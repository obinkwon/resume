<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Resume Manager</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
    <div class="container">
        <h1>Resume Template Engine</h1>

        <a class="btn primary" th:href="@{/web/resume/regist}">새 이력서 작성</a>

        <div class="resume-list">
            <div class="resume-card" th:each="resume : ${resumeList}">
                <h3 th:text="${resume.title}"></h3>
                <p th:text="${resume.name}"></p>

                <div class="actions">
                    <a th:href="@{/web/resume/update/{id}(id=${resume.resumeId})}">수정</a>
                    <a th:href="@{/web/resume/template/{id}(id=${resume.resumeId})}">템플릿</a>
                    <a th:href="@{/web/resume/preview/{id}(id=${resume.resumeId})}">미리보기</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
